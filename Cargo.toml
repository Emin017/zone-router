[package]
name = "api-router"
version = "0.1.0"
edition = "2021"
authors = ["Emin <example@example.com>"]
description = "A lightweight HTTP proxy for routing Claude Code LLM API requests to multiple backends"

[[bin]]
name = "api-router"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
ratatui = "0.29"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tempfile = "3"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
